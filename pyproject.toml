[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-platform"
version = "1.0.0"
description = "AI Trading Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pip-audit>=2.0",
    "psycopg2-binary>=2.9",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
]

[project.scripts]
trading-platform = "trading_platform.cli:main"

[tool.setuptools.packages.find]
where = ["trading-platform/src"]
exclude = ["*test*", "*demo*", "*debug*", "*temp_*", "walk_forward_first_fold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q -m 'not external'"
markers = [
    "gate(name): mark test as belonging to a promotion gate",
    "external: mark test as requiring external setup",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "I", "S", "W"]
exclude = ["walk_forward_first_fold.py"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_any_generics = true
exclude = ["walk_forward_first_fold.py"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
